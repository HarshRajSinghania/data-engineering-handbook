site_name: "Sarang's Data Engineering Handbook"
site_description: A connected reference for data engineering — foundations, storage, processing, orchestration, streaming, quality, infrastructure, and AI.
site_url: https://sarangambekar1997.github.io/data-engineering-handbook/
repo_url: https://github.com/sarangambekar1997/data-engineering-handbook
repo_name: data-engineering-handbook
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Sarang Ambekar · MIT License

docs_dir: docs
exclude_docs: |
  _template.md
  includes/

# Fail the build on broken internal links and anchors (used with `mkdocs build --strict`)
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Renders each guide's "Last reviewed" line from its front matter (hooks/freshness.py)
hooks:
  - hooks/freshness.py
  - hooks/seo.py

theme:
  name: material
  language: en
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.indexes
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tooltips
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/print-cheatsheet.js

plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true

extra:
  # Links each guide to its PDF. The PDFs are built after the site by tools/build_pdfs.py (see docs/maintenance.md)
  pdf_downloads: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sarangambekar1997
      name: Sarang Ambekar on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-compatible heading IDs, so the same anchor links work on GitHub and on the site
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      # Only ## headings appear in the right-hand "On this page" panel. Guides also use
      # ### for sub-topics; those stay valid, linkable anchors (e.g. the homepage's card
      # grid still points at them), they just don't clutter the sidebar. Some guides had
      # 40+ headings in that panel before this — see de-concepts.md (36 ### headings).
      toc_depth: 2
  - pymdownx.details
  - pymdownx.emoji:
      # Enables :material-*:, :fontawesome-*: and :octicons-*: icon shortcodes,
      # used by the homepage's card grid and available in any guide.
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Appends this file to every page so `abbr` can turn matching terms (SCD, CDC, ACID...)
      # into a dotted, hoverable tooltip anywhere they appear, without a click to the glossary.
      base_path: [docs/includes]
      auto_append: [abbreviations.md]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

