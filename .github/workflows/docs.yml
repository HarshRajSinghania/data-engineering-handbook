name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/**"
      - "hooks/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/**"
      - "hooks/**"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC — external link check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site (strict)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the "last updated" dates come from the Git history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Code blocks parse
        run: python tools/check_code_blocks.py

      - name: No retired model IDs
        run: python tools/check_model_ids.py

      - name: Review dates and lab versions
        run: python tools/check_freshness.py

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Mermaid diagrams parse
        run: |
          npm install --no-save --prefix tools mermaid jsdom
          node tools/check_mermaid.mjs

      # --strict turns warnings (broken internal links, missing anchors,
      # pages missing from nav) into build failures
      - name: Build
        run: mkdocs build --strict

      - name: Search and sharing metadata
        run: python tools/check_seo.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  freshness:
    name: Freshness and retired model IDs
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      # Runs weekly so a newly retired model (added to tools/deprecated_models.txt)
      # is flagged even when no docs change
      - run: python tools/check_model_ids.py

      - name: Review dates and lab versions are valid
        run: python tools/check_freshness.py

      # Guides not reviewed for 180 days go into one tracking issue that is
      # kept up to date, and closed once nothing is overdue
      - name: Report overdue guides
        run: python tools/check_freshness.py --max-age-days 180 --report stale.md || true

      - name: Open or update the tracking issue
        if: hashFiles('stale.md') != ''
        run: |
          title="Guides overdue for review"
          gh label create maintenance --color 5319e7 --description "Upkeep of existing guides" 2>/dev/null || true
          number=$(gh issue list --label maintenance --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file stale.md
          else
            gh issue create --title "$title" --label maintenance --body-file stale.md
          fi

      - name: Close the tracking issue when nothing is overdue
        if: hashFiles('stale.md') == ''
        run: |
          number=$(gh issue list --label maintenance --state open --search "\"Guides overdue for review\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then gh issue close "$number" --comment "No guides are overdue for review."; fi

  external-links:
    name: Check external links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Reports broken external URLs without blocking merges; internal links
      # are already enforced by the strict build above.
      # leetcode.com blocks non-browser clients with 403; lmstudio.ai's Next.js
      # edge returns a bare 307 (no Location) to requests without full browser
      # headers. Both resolve fine in an actual browser — confirmed by hand.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --exclude 'example\.com'
            --exclude 'localhost'
            --exclude '127\.0\.0\.1'
            --exclude 'your-'
            --exclude 'leetcode\.com'
            --exclude 'lmstudio\.ai'
            'docs/**/*.md' README.md
          fail: false
          jobSummary: true
