name: Metrics

# GitHub keeps only 14 days of repository traffic. This saves each week's numbers, plus the star count, to CSV
# files on the `metrics` branch, so the history is not lost. The branch holds nothing but those files.
#
# The traffic endpoints need push access. The built-in token cannot read them, so add a repository secret named
# TRAFFIC_TOKEN (a fine-grained personal access token for this repository; see docs/maintenance.md). Without it
# the job still records stars, forks and open issues, and warns that traffic was skipped.

on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays: well inside the 14-day window
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  archive:
    name: Archive traffic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check out the metrics branch (created on the first run)
        run: |
          if git ls-remote --exit-code --heads origin metrics > /dev/null; then
            git fetch origin metrics
            git worktree add -B metrics ../metrics origin/metrics
          else
            git worktree add --orphan -b metrics ../metrics
          fi

      - name: Save this week's numbers
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/archive_traffic.py --repo "$GITHUB_REPOSITORY" --out ../metrics

      - name: Commit
        working-directory: ../metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "metrics: $(date -u +%Y-%m-%d)"
            git push origin metrics
          fi
